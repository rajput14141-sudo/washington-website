services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: washin_ton
      MYSQL_USER: carwash
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build:
      context: ./backend/CarWash.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Data Source=/data/carwash.db
      Sqlite__DataDirectory: /data
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      SignupMySql__Server: mysql
      SignupMySql__Port: 3306
      SignupMySql__Database: washin_ton
      SignupMySql__User: carwash
      SignupMySql__Password: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost}
      SeedAdmin__Enabled: ${SEED_ADMIN_ENABLED:-false}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-}
      HttpsRedirection__Enabled: false
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - api-data:/data

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  api-data:
  mysql-data: